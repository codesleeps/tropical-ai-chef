name: Production Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

# NOTE: this workflow does NOT publish to GitHub Pages. deploy.yml is the sole
# Pages publisher because it runs scripts/deploy-to-docs.js, which rewrites the
# canonical/OG URLs to the codesleeps.github.io origin and writes docs/404.html
# (the SPA deep-link fallback). Publishing a raw ./dist here as well meant the
# last workflow to finish won the race, shipping a build with Vercel canonicals
# and no 404 fallback.
permissions:
  contents: read
  # Required by github/codeql-action/upload-sarif to publish the Trivy SARIF to
  # the repo's code-scanning tab. Without it the upload step fails with
  # "Resource not accessible by integration".
  security-events: write

# Build/verify only — keep a group of our own so we never queue behind (or race)
# the Pages deployment in deploy.yml.
concurrency:
  group: "production-build"
  cancel-in-progress: false

jobs:
  # Build and test job
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better analysis

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify environment configuration
        run: |
          echo "Checking environment files..."
          ls -la .env* || echo "No .env files found"

      - name: Run TypeScript compilation check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true # Don't fail on lint warnings

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true # Don't fail on security warnings

      - name: Build application (development)
        run: npm run build:dev
        if: github.event_name == 'pull_request'

      - name: Build application (production)
        run: node scripts/build-production.js production
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          NODE_ENV: production

      - name: Analyze bundle size
        run: npm run analyze
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files-${{ matrix.node-version }}
          path: |
            dist/
            build-report.json
          retention-days: 30
        if: github.event_name == 'push' && matrix.node-version == '20.x'

  # Security scan job
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        if: always()

  # Lighthouse performance audit (runs against the deploy.yml Pages deployment)
  lighthouse-audit:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for the Pages deployment to propagate
        run: sleep 60 # Give deploy.yml time to publish

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ vars.PAGES_URL || 'https://codesleeps.github.io/tropical-ai-chef/' }}
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: "./.lighthouserc.json"
        continue-on-error: true # Don't fail the workflow on performance issues

  # Notification job
  notify:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, lighthouse-audit]
    if: always() && github.event_name == 'push'

    steps:
      - name: Build Status Notification
        run: |
          if [ "${{ needs.build-and-test.result }}" == "success" ]; then
            echo "✅ Production build successful!"
            echo "🚀 GitHub Pages publishes via the 'Deploy to GitHub Pages' workflow"
          else
            echo "❌ Production build failed"
            echo "🔍 Check the logs for more details"
          fi

          echo "📊 Build Results:"
          echo "  - Build & Test: ${{ needs.build-and-test.result }}"
          echo "  - Security Scan: ${{ needs.security-scan.result }}"
          echo "  - Lighthouse Audit: ${{ needs.lighthouse-audit.result }}"